openapi: 3.0.3
info:
  title: GiftLstr API
  description: >
    Backend API for the GiftLstr app. All endpoints require authentication
    with a valid Authentik session token (OIDC access-token JWT), sent as a
    Bearer token in the Authorization header.
  version: 1.0.0

servers:
  - url: /

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authentik session access token (OIDC JWT, signed by the provider).

  parameters:
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    pathId:
      name: id
      in: path
      required: true
      schema:
        type: string
        description: UUID id (user or item, depending on the endpoint).

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Ok:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]
    User:
      type: object
      properties:
        id:
          type: string
          description: UUID.
        username:
          type: string
        displayName:
          type: string
        isAdmin:
          type: boolean
        birthday:
          type: string
          description: Reset date for the birthday list, formatted MM-DD.
        allowSuggestions:
          type: boolean
        spendingEnabled:
          type: boolean
          description: >
            When true the user can attach private prices to items they claim and
            see their running total spend.
        themeStyle:
          type: string
          description: Active theme, defaults to "aurora".
        shareCode:
          type: string
          description: Code others can use to connect; empty when sharing is disabled.
        isNew:
          type: boolean
          description: True right after account creation (drives the first-run birthday prompt).
      required: [id, username, displayName, isAdmin, birthday]
    Item:
      type: object
      properties:
        id:
          type: string
          description: UUID.
        title:
          type: string
        url:
          type: string
        notes:
          type: string
        removedAt:
          type: string
          nullable: true
        claimed:
          type: boolean
        claimedByMe:
          type: boolean
        claimedByName:
          type: string
          description: >
            Only present where exposing the claimer is allowed (own list and
            archived lists).
        mySpendCents:
          type: integer
          description: >
            The viewer's private price on this item in cents. Only present for
            items the viewer holds a claim on and when spending tracking is
            enabled.
      required: [id, title, url, notes, removedAt, claimed, claimedByMe]
    ListUser:
      type: object
      description: Owner of a user list (subset of User).
      properties:
        id:
          type: string
          description: UUID.
        username:
          type: string
        displayName:
          type: string
        birthday:
          type: string
          description: Birthday MM-DD.
        themeStyle:
          type: string
          description: >
            The active theme. For a private list this is the theme chosen for
            that list rather than the account's profile theme.
        holidayReset:
          type: string
      required: [id, username, displayName]
    UserListResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/ListUser'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        isOwner:
          type: boolean
        totalSpendCents:
          type: integer
          description: >
            The viewer's private spend in cents on the active items of exactly
            this list. Only present when spending tracking is enabled.
      required: [user, items, isOwner]
    ListsPageUser:
      type: object
      properties:
        id:
          type: string
          description: UUID.
        displayName:
          type: string
        username:
          type: string
        birthday:
          type: string
          description: Birthday MM-DD.
        myClaims:
          type: integer
          description: Number of items the current user has claimed on this user's active list.
        connected:
          type: boolean
        isPrivate:
          type: boolean
          description: >
            True for the caller's own private lists, which are merged into this
            page inline. Private lists are only ever returned to their owner.
        canView:
          type: boolean
        claimedLabel:
          type: string
          description: 'e.g. "claimed 2 items", empty when nothing is claimed.'
        spendCents:
          type: integer
          description: >
            The viewer's private spend in cents on this user's active list.
            Only present when the viewer has claimed something and spending
            tracking is enabled.
      required: [id, displayName, username, birthday, myClaims, connected, isPrivate, canView, claimedLabel]
    ListsPageResponse:
      type: object
      properties:
        users:
          type: array
          description: >
            Users the viewer may see merged with the viewer's own private
            lists, sorted together: dated entries by birthday then name,
            undated entries last.
          items:
            $ref: '#/components/schemas/ListsPageUser'
        page:
          type: integer
        hasMore:
          type: boolean
        total:
          type: integer
          description: Visible users plus the caller's private lists.
      required: [users, page, hasMore, total]
    PrivateListResponse:
      type: object
      description: >
        One of the caller's own private lists. Same shape as a user list;
        username is always empty and displayName is "First Last".
      properties:
        user:
          $ref: '#/components/schemas/ListUser'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        isOwner:
          type: boolean
        totalSpendCents:
          type: integer
          description: >
            The viewer's private spend in cents on the active items of this
            list. Only present when spending tracking is enabled.
      required: [user, items, isOwner]
    ArchiveListSummary:
      type: object
      properties:
        id:
          type: string
          description: UUID.
        label:
          type: string
          description: 'The reset date that triggered the archive, e.g. "2026-07-01".'
        archivedAt:
          type: string
        itemCount:
          type: integer
        claimedCount:
          type: integer
        firstName:
          type: string
          description: For a rolled-over private list, the person's first name.
        lastName:
          type: string
          description: For a rolled-over private list, the person's last name.
        birthday:
          type: string
          description: For a rolled-over private list, the person's MM-DD birthday.
        theme:
          type: string
          description: For a rolled-over private list, its theme style.
      required: [id, label, archivedAt, itemCount, claimedCount]
    ArchiveIndexResponse:
      type: object
      properties:
        lists:
          type: array
          items:
            $ref: '#/components/schemas/ArchiveListSummary'
        page:
          type: integer
        hasMore:
          type: boolean
        total:
          type: integer
      required: [lists, page, hasMore, total]
    ArchiveDetailResponse:
      type: object
      properties:
        id:
          type: string
          description: UUID.
        label:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        firstName:
          type: string
          description: For a rolled-over private list, the person's first name.
        lastName:
          type: string
          description: For a rolled-over private list, the person's last name.
        isPrivate:
          type: boolean
          description: True when the archived list was a private list.
      required: [id, label, items]
    AdminUser:
      type: object
      properties:
        id:
          type: string
          description: UUID.
        username:
          type: string
        displayName:
          type: string
        isAdmin:
          type: boolean
        birthday:
          type: string
        itemCount:
          type: integer
          description: Items on the user's active list (excluding removed).
        claimedCount:
          type: integer
          description: Claims held on the user's active list.
        connections:
          type: array
          items:
            type: string
          description: Outgoing connection user ids (UUIDs).
        connectedBy:
          type: array
          items:
            type: string
          description: Incoming connection user ids (UUIDs).
      required: [id, username, displayName, isAdmin, birthday, itemCount, claimedCount, connections, connectedBy]
    MeResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        activeListId:
          type: string
          description: UUID of the user's active list.
      required: [user, activeListId]

  responses:
    Unauthorized:
      description: Missing or invalid session token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Not permitted to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  /api/oidc/discovery:
    get:
      summary: OIDC discovery document (proxied, browser-safe)
      security: []
      responses:
        '200':
          description: >
            OIDC discovery document with endpoints rewritten for the browser.
            Not authenticated — the SPA fetches this to start sign-in.
        '503':
          description: Identity provider not configured.

  /api/oidc/token:
    post:
      summary: OIDC token exchange (proxied to Authentik)
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                code:
                  type: string
                redirect_uri:
                  type: string
                client_id:
                  type: string
                code_verifier:
                  type: string
                refresh_token:
                  type: string
              required: [grant_type, client_id]
      responses:
        '200':
          description: Token response (access_token + optional refresh_token).
        '400':
          description: Invalid client_id or malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Identity provider not configured.

  /api/me:
    get:
      summary: Get the current user and their active list id
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/profile:
    patch:
      summary: Update profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                birthday:
                  type: string
                  description: MM-DD reset date.
                spendingEnabled:
                  type: boolean
                  description: Toggle private spending tracking.
              required: [birthday]
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Invalid birthday format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/lists:
    get:
      summary: List all users' lists (paginated)
      description: >
        Users the viewer may see (everyone for admins, connections otherwise)
        merged with the viewer's own private lists as one inline sequence.
      parameters:
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Paginated list of users with claim info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListsPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/private-lists:
    post:
      summary: Create a private list
      description: >
        Creates a private list of gift ideas for a person (first name, last
        name, birthday) owned solely by the caller. Private lists are never
        shared and appear inline on /api/lists; they archive around the
        person's birthday or on request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                birthday:
                  type: string
                  description: Birthday MM-DD.
                theme:
                  type: string
                  description: ThemeStyle for the list; defaults to "aurora".
              required: [firstName, lastName, birthday]
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: UUID of the new private list.
                required: [id]
        '400':
          description: 'Missing name or invalid birthday.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/private-lists/{id}:
    get:
      summary: Get one of your private lists
      description: Only the owner can read a private list; everyone else gets 404.
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: The private list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Private list not found (or not yours).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Update one of your private lists
      description: >
        Updates any of firstName, lastName, birthday or theme on one of the
        caller's private lists. The list is renamed to "First Last". Only the
        owner may edit it.
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                birthday:
                  type: string
                  description: Birthday MM-DD.
                theme:
                  type: string
                  description: ThemeStyle for the list; defaults to "aurora".
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                required: [id]
        '400':
          description: 'Empty patch, invalid name, birthday or theme.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Private list not found (or not yours).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Hard-delete one of your private lists
      description: Permanently deletes the list; its items and claims cascade away.
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Private list not found (or not yours).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/private-lists/{id}/archive:
    post:
      summary: Archive one of your private lists
      description: >
        Archives the list immediately under a "First Last Manual Archive"
        label, mirroring the automatic birthday rollover: claimed ideas stay
        behind with the archived list and a fresh private list carries over the
        unclaimed, non-removed ones. Returns the fresh list's id.
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Archived.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: UUID of the fresh replacement private list.
                required: [id]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Private list not found (or not yours).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/{id}/list:
    get:
      summary: Get a user's active list
      description: Requires a connection to the user (or admin). Claimer names are only exposed on your own list; claims by others appear as generic "claimed".
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: The active list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/my/items:
    post:
      summary: Add an item to your own list
      description: >
        Adds to the caller's active list, or to one of the caller's private
        lists when listId is given. Amazon links are stored in canonical
        product form: short links (a.co, amzn.to, ...) are expanded and
        tracking parameters and title slugs are dropped, yielding
        https://<storefront>/dp/<ASIN>. Other links are stored unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                url:
                  type: string
                notes:
                  type: string
                listId:
                  type: string
                  description: UUID of one of the caller's private lists.
              required: [title]
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: UUID.
                required: [id]
        '400':
          description: 'Title required, or the list is full (max 200 items).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: listId does not name one of the caller's private lists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/my/items/{id}:
    patch:
      summary: Edit an item on your own list
      description: >
        Amazon URLs are canonicalized the same way as on create: short links
        are expanded and the URL is reduced to https://<storefront>/dp/<ASIN>.
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                url:
                  type: string
                notes:
                  type: string
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Item not found on your list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Soft-delete an item from your own list
      description: Claimers still see the item, marked as removed.
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Item not found on your list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/my/items/order:
    put:
      summary: Reorder the items on your own list
      description: >
        Assigns sequential sort orders (array position) to the given item ids.
        Every id must belong to the target list: the caller's active list, or
        the private list named by listId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  description: All active item ids (UUIDs) in their new display order.
                listId:
                  type: string
                  description: UUID of one of the caller's private lists.
              required: [ids]
      responses:
        '200':
          description: Reordered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: An id was not found on the target list, or listId is not the caller's private list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/my/items/{id}/restore:
    post:
      summary: Restore a soft-deleted item on your own list
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Removed item not found on your active list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/items/{id}/claim:
    put:
      summary: Claim an item on another user's list
      description: >
        Prevents duplicate purchases. Idempotent when you already hold the
        claim. On your own private list you may claim your own ideas to track
        prices; nobody else can claim there at all.
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Claimed (or already claimed by you).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Cannot claim this item (not connected, own item, private list you do not own, or inactive list).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Already claimed by someone else.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Release your claim on an item
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Unclaimed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: You have not claimed this item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/items/{id}/price:
    patch:
      summary: Set the private price on an item you claimed
      description: >
        Records how much you spent on this gift. The price is stored on your
        claim and is only ever visible to you. Passing a price of 0 clears it.
        Requires spending tracking to be enabled on your profile.
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                price:
                  type: number
                  description: Price in dollars, e.g. 12.34. 0 clears it.
              required: [price]
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  mySpendCents:
                    type: integer
                    description: The stored price in cents for this item.
                  totalSpendCents:
                    type: integer
                    description: Your private spend in cents on the active items of this item's list.
                required: [ok, mySpendCents, totalSpendCents]
        '400':
          description: Bad price value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Spending tracking is disabled on your profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: You have not claimed this item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/connect/share:
    put:
      summary: Enable or disable share-code connections for the current user
      description: >
        Enabling generates a fresh unique share code and returns it; disabling
        deletes the code so nobody can connect with it again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
              required: [enabled]
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  shareCode:
                    type: string
                    description: The new share code, empty when disabled.
                required: [shareCode]
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/connect/accept:
    post:
      summary: Connect to the user owning the given share code
      description: >
        Creates a bidirectional connection between the caller and the user that
        owns the code. Cannot connect to yourself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: The 8-character share code of the target user.
              required: [code]
      responses:
        '200':
          description: Connected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  displayName:
                    type: string
                    description: Display name of the user you connected with.
                required: [ok]
        '400':
          description: 'Missing/invalid code, or you tried to use your own code.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No user found with that share code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/archive:
    get:
      summary: List your archived lists (paginated)
      description: >
        Without a type this returns ordinary rolled-over lists. With
        type=private it returns the private lists that have rolled over on their
        person's birthday.
      parameters:
        - $ref: '#/components/parameters/page'
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [private]
          description: Set to private to list rolled-over private lists instead.
      responses:
        '200':
          description: Archived lists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveIndexResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/archive/{id}:
    get:
      summary: Read-only view of an archived list, showing who claimed what
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Archived list detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Archive not found (or not yours).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/users:
    get:
      summary: List all users with their connections (admin only)
      parameters:
        - $ref: '#/components/parameters/page'
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Search filter on displayName or username.
      responses:
        '200':
          description: Users (paginated, 25 per page).
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUser'
                  page:
                    type: integer
                  hasMore:
                    type: boolean
                  total:
                    type: integer
                required: [users, page, hasMore, total]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/users/{id}:
    patch:
      summary: Update a user's birthday or admin flag (admin only)
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                birthday:
                  type: string
                isAdmin:
                  type: boolean
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      summary: Delete a user and all their data (admin only)
      description: Permanently removes the user, their lists, items, claims and connections. Cannot delete yourself or the last admin.
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Cannot delete yourself or the last admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/connections:
    put:
      summary: Add or remove the connection between two users (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                a:
                  type: string
                  description: UUID.
                b:
                  type: string
                  description: UUID.
                add:
                  type: boolean
                bidirectional:
                  type: boolean
                  default: true
                  description: When adding, also create the reverse connection.
              required: [a, b, add]
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
