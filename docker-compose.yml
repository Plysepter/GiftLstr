# Combined GiftLstr + Authentik stack. This file simply ingests the two
# split-out compose files (docker/giftlstr/ and docker/authentik/) so consumers
# can run everything with a single `docker compose up` instead of bringing up
# each stack separately.
#
#   docker compose -f docker-compose.yml up -d --build
#
# Equivalent to running the two sub-stacks individually:
#
#   docker compose -f docker/authentik/docker-compose.yml up -d
#   docker compose -f docker/giftlstr/docker-compose.yml up -d --build
#
# Config is driven by the same environment variables as the split-out files
# (see .env / README). PORT (default 8080) sets both the app's container
# listen port and its published host port, letting you avoid collisions with
# other web servers on a shared Docker network.
#
# All services share the combined stack's default network, so the app reaches
# Authentik at `http://authentik:9000` (the `container_name`) out of the box.
# A reverse proxy (e.g. Caddy) in front proxies public hosts to the app's
# published PORT and to Authentik's published 9000. Relative build/data paths
# in the included files resolve against their own directories, so `../..` still
# points at this repo root.
include:
  - path: docker/giftlstr/docker-compose.yml
  - path: docker/authentik/docker-compose.yml
